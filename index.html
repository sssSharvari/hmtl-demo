<!DOCTYPE html>
<html>
<head>
    <title>Foodie's Paradise</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Welcome to Foodie's Paradise</h1>

    <!-- Image -->
    <img src="restaurant.jpg" alt="Restaurant Image" width="400">

    <!-- Navigation Links -->
    <h2>Menu Links</h2>
    <a href="#">Home</a> |
    <a href="#">Menu</a> |
    <a href="#">Contact</a>

    <!-- Table -->
    <h2>Today's Special</h2>
    <table border="1">
        <tr>
            <th>Dish</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Paneer Butter Masala</td>
            <td>250</td>
        </tr>
        <tr>
            <td>Veg Biryani</td>
            <td>180</td>
        </tr>
    </table>

    <!-- Form -->
    <h2>Reservation Form</h2>
    <form>
        Name: <input type="text"><br><br>
        Password: <input type="password"><br><br>

        Gender:
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br><br>

        Food Choice:
        <input type="checkbox"> Veg
        <input type="checkbox"> Non-Veg<br><br>

        <input type="submit" value="Book Now">
    </form>

</body>
</html>
